<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automata Lab</title>
<meta name="description" content="Build, simulate and understand finite automata (FA) and nondeterministic finite automata (NFA).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<script>
  // day/night: the saved choice, otherwise the system setting (set before the page is drawn, so it never flashes)
  try {
    var t = localStorage.getItem('automata-lab:theme');
    document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t
      : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) { /* storage unavailable: light */ }
</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="16" r="6"/><circle cx="24" cy="16" r="6"/><circle cx="24" cy="16" r="3.6"/><path d="M15 16h2.6"/><path d="M16.4 13.4 19 16l-2.6 2.6"/></svg>
    <h1>Automata Lab</h1>
    <span class="pill" id="editor-pill" hidden title="Exercise editor: create exercises in the Exercise tab">Editor</span>
  </div>
  <div class="seg" id="type-seg" role="radiogroup" aria-label="Automaton type">
    <button type="button" data-type="FA" role="radio" title="Finite automaton — δ: Q × Σ → Q">FA</button>
    <button type="button" data-type="NFA" role="radio" title="Nondeterministic finite automaton — δ: Q × Σ → 𝒫(Q)">NFA</button>
  </div>
  <button type="button" class="pill ex-chip" id="ex-chip" hidden title="Leave the exercise and go back to your own automaton">Exercise <span aria-hidden="true">·</span> Leave ×</button>
  <div class="acts">
    <button type="button" class="btn" id="btn-examples" aria-haspopup="menu">Examples
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button type="button" class="btn sq" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button type="button" class="btn sq" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button type="button" class="btn" id="btn-new" title="Start with an empty automaton">New</button>
    <button type="button" class="btn" id="btn-guide" title="Show the short introduction again">Guide</button>
    <button type="button" class="btn sq" id="btn-theme" title="Night mode" aria-label="Switch to night mode">
      <svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button type="button" class="btn dark" id="btn-share" title="Copy a link that contains this automaton">Share link</button>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="State diagram">
    <div class="stage-hint" id="stage-hint"></div>
    <svg id="graph" class="graph" role="img" aria-label="State diagram of the automaton"></svg>
    <div class="empty" id="empty" hidden>
      <b>No states yet</b>
      <span>Choose <em>State</em> below, then click here.</span>
    </div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" id="btn-zoom-in" title="Zoom in (or scroll on the diagram)" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <span id="zoom-level" class="zl">100%</span>
      <button type="button" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" id="btn-fit" title="Fit: always keep the whole automaton in view" aria-label="Fit to view"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="tools" role="toolbar" aria-label="Tools">
      <button type="button" data-mode="select" title="Move states · click a state or an arrow to edit it">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><span>Select</span></button>
      <button type="button" data-mode="state" title="Click on empty space to add a state">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8.5v7M8.5 12h7"/></svg><span>State</span></button>
      <button type="button" data-mode="arrow" title="Drag from one state to another, or click two states">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="m14 7 5 5-5 5"/></svg><span>Arrow</span></button>
      <i class="sep" aria-hidden="true"></i>
      <button type="button" data-action="arrange" title="Arrange like in the solutions: initial state on the left, reading direction left → right">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="19" cy="15" r="2"/><circle cx="5" cy="15" r="2"/><path d="M10.5 6.5 6.3 13M13.5 6.5l4.2 6.5M7 16h10"/></svg><span>Arrange</span></button>
    </div>
  </section>

  <aside class="panel">
    <div class="seg ptabs" role="tablist">
      <button type="button" role="tab" data-tab="definition">Definition</button>
      <button type="button" role="tab" data-tab="simulation">Simulation</button>
      <button type="button" role="tab" data-tab="classes">Classes</button>
      <button type="button" role="tab" data-tab="exercise">Exercise</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>
</main>

<div id="pop" class="pop" hidden></div>
<div id="guide" class="scrim" hidden></div>
<div id="projector" class="projector" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- raise every ?v= number at each release, so browsers never mix old and new files -->
<!-- all files sit next to index.html (no subfolders), so uploading to GitHub is just "select all files" -->
<script src="core.js?v=2"></script>
<script src="graph.js?v=2"></script>
<script src="guide.js?v=2"></script>
<script src="live-config.js?v=2"></script>
<script src="live.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
